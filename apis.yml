apis:
- aid: prime-intellect:prime-intellect-sandbox-api
  name: Prime Intellect Sandbox API
  tags:
  - Sandbox
  - Code Execution
  - Agents
  - Tunnels
  humanURL: https://docs.primeintellect.ai/sandboxes/overview
  baseURL: https://api.primeintellect.ai
  properties:
  - url: https://docs.primeintellect.ai/sandboxes/overview
    type: Documentation
  - url: https://docs.primeintellect.ai/sandboxes/sdk
    type: Documentation
  - url: https://docs.primeintellect.ai/sandboxes/cli
    type: Documentation
  - url: https://docs.primeintellect.ai/sandboxes/tunnel
    type: Documentation
  - url: openapi/prime-intellect-sandbox-api-openapi.yml
    type: OpenAPI
  - url: json-schema/prime-intellect-sandbox-schema.json
    type: JSONSchema
  description: >-
    Secure remote code-execution sandboxes for AI agents. Create and manage Python-3.11-slim-based sandboxes,
    expose ports for HTTP services running inside the sandbox, open SSH sessions, pull rich error context
    for failures, and provision reverse tunnels back into a sandbox from an external network. Available
    as a lightweight `prime-sandboxes` Python package (~50KB) in addition to the full `prime` CLI/SDK.
- aid: prime-intellect:prime-intellect-training-api
  name: Prime Intellect Training API
  tags:
  - Reinforcement Learning
  - Training
  - Fine-Tuning
  - Foundation Models
  - Billing
  humanURL: https://docs.primeintellect.ai/hosted-training/what-is-lab
  baseURL: https://api.primeintellect.ai
  properties:
  - url: https://docs.primeintellect.ai/hosted-training/what-is-lab
    type: Documentation
  - url: https://docs.primeintellect.ai/hosted-training/getting-started
    type: Documentation
  - url: https://docs.primeintellect.ai/hosted-training/end-to-end-run
    type: Documentation
  - url: https://docs.primeintellect.ai/hosted-training/models-and-pricing
    type: Pricing
  - url: openapi/prime-intellect-training-api-openapi.yml
    type: OpenAPI
  - url: json-schema/prime-intellect-training-run-schema.json
    type: JSONSchema
  description: >-
    Hosted reinforcement-learning post-training service ("Lab"). Launch dedicated training runs against
    a catalog of base models — Qwen3.5 (0.8B through 397B-A17B), Llama 1B/3B Instruct, NVIDIA Nemotron
    30B/120B, OpenAI gpt-oss 20B/120B — drive them with environments from the Environments Hub, and retrieve
    token-level usage + USD cost per run from the billing endpoints. Pricing is per-million-token across
    separate input, output, and training meters.
- aid: prime-intellect:prime-intellect-inference-api
  name: Prime Intellect Inference API
  tags:
  - Inference
  - OpenAI-Compatible
  - Foundation Models
  - LLM
  tags_raw:
  - Inference
  - OpenAI Compatible
  - Foundation Models
  - LLM
  humanURL: https://docs.primeintellect.ai/inference/overview
  baseURL: https://api.pinference.ai/api/v1
  properties:
  - url: https://docs.primeintellect.ai/inference/overview
    type: Documentation
  - url: https://docs.primeintellect.ai/inference/usage
    type: Documentation
  - url: https://docs.primeintellect.ai/inference/adapter-deployments
    type: Documentation
  - url: openapi/prime-intellect-inference-api-openapi.yml
    type: OpenAPI
  description: >-
    OpenAI-compatible inference API for hosted frontier and open models served at api.pinference.ai. Supports
    streaming chat completions, the full set of OpenAI parameters (temperature, top_p, max_tokens, logprobs),
    and returns a `usage` object with input/output token counts and USD cost on every response. LoRA adapters
    can be served alongside base models via 1-click deployments.
